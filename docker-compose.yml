services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "7860:7860"
    volumes:
      - ./data:/data

  # Optional: Cloudflare WARP sidecar — gives yt-dlp a Cloudflare exit IP so
  # YouTube stops flagging your VPS ("Sign in to confirm you're not a bot").
  #   docker compose --profile warp up -d
  # then set PROXY=socks5://warp:1080 in .env (or apply it in the Admin panel).
  warp:
    image: caomingjun/warp:latest
    container_name: warp
    restart: unless-stopped
    profiles: ["warp"]
    device_cgroup_rules:
      - "c 10:200 rwm"
    ports:
      - "127.0.0.1:1080:1080"
    environment:
      - WARP_SLEEP=2
      # - WARP_LICENSE_KEY=   # optional WARP+ key
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./warp-data:/var/lib/cloudflare-warp

  # Optional: self-hosted Cobalt — one-POST downloads for Instagram/TikTok/X/…
  #   docker compose --profile cobalt up -d
  # then set COBALT_API_URL=http://cobalt:9000 in .env
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    container_name: cobalt
    restart: unless-stopped
    profiles: ["cobalt"]
    environment:
      # URL cobalt puts into its tunnel links; the bot fetches tunnels
      # server-side, so the compose-internal address is enough.
      - API_URL=http://cobalt:9000/
      - API_PORT=9000
    ports:
      - "127.0.0.1:9000:9000"
