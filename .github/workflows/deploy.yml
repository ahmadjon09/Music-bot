name: Sync to Hugging Face Hub

on:
  push:
    branches:
      - main 


  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push https://ahmadjon09:$HF_TOKEN@huggingface.co/spaces/ahmadjon09/65d7c835be54c752 main
